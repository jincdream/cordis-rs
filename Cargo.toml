[workspace]
resolver = "2"
members = [
  "crates/cordis",
  "crates/cordis-create",
  "crates/cordis-core",
  "crates/cordis-group",
  "crates/cordis-hmr",
  "crates/cordis-include",
  "crates/cordis-logger-console",
  "crates/cordis-loader",
  "crates/cordis-timer",
  "crates/cordis-utils",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/jincdream/cordis-rs"

[workspace.dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
futures = "0.3.31"
parking_lot = "0.12.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "macros", "rt-multi-thread", "sync", "test-util", "time"] }
yaml-rust2 = { version = "0.12.0", default-features = false }
